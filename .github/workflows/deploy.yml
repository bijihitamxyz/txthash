name: Deploy
on:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            # 1. Masuk ke root repository git
            cd /home/ubuntu/txthash
            
            # 2. Tarik update dan timpa paksa semua file
            git fetch --all
            git reset --hard origin/main
            
            # 3. Masuk ke folder aplikasi revo
            cd /home/ubuntu/txthash/revo
            
            # 4. Install dependencies baru & build ulang
            npm install
            npm run build
            
            # 5. Restart aplikasi di PM2 agar membaca kode terbaru
            pm2 restart all
